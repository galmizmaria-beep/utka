<!doctype html><meta charset="utf-8"><title>Header actions and custom audio</title>
<iframe id="editor" src="../index.html"></iframe><pre id="result">RUNNING</pre>
<script>
const wait=ms=>new Promise(r=>setTimeout(r,ms));
editor.onload=async()=>{try{await wait(400);const w=editor.contentWindow,d=editor.contentDocument,$=s=>d.querySelector(s),api=w.EditorV5,c=api.getConfig(),checks={},downloads=[];if(!$('#restoreModal').hidden)$('#restoreDelete').click();
let copied='';Object.defineProperty(w.navigator,'clipboard',{configurable:true,value:{writeText:async text=>{copied=text}}});
const make=w.URL.createObjectURL,click=w.HTMLAnchorElement.prototype.click;w.URL.createObjectURL=blob=>{downloads.push(blob);return make.call(w.URL,blob)};w.HTMLAnchorElement.prototype.click=function(){};
$('#saveProject').click();checks.projectDownload=JSON.parse(await downloads.at(-1).text()).schemaVersion>=8;
$('#exportHtml').click();checks.htmlDownload=(await downloads.at(-1).text()).includes('function standaloneRuntime');
w.URL.createObjectURL=make;w.HTMLAnchorElement.prototype.click=click;
await $('#copyGenially').onclick();checks.geniallyCode=copied.includes('game-v20260927-forest1.html#project-gzip=');

copied='';await $('#v5CopyPublicEmbed').onclick();checks.secondCopyButton=copied.includes('game-v20260927-forest1.html#project-gzip=');
// A generated PCM WAV exercises file loading without an external audio dependency.
const buffer=new ArrayBuffer(244),view=new DataView(buffer),str=(offset,text)=>[...text].forEach((x,i)=>view.setUint8(offset+i,x.charCodeAt(0)));str(0,'RIFF');view.setUint32(4,236,true);str(8,'WAVEfmt ');view.setUint32(16,16,true);view.setUint16(20,1,true);view.setUint16(22,1,true);view.setUint32(24,8000,true);view.setUint32(28,16000,true);view.setUint16(32,2,true);view.setUint16(34,16,true);str(36,'data');view.setUint32(40,200,true);
const dt=new w.DataTransfer();dt.items.add(new w.File([buffer],'audit.wav',{type:'audio/wav'}));const upload=$('[data-audio="victory"]');upload.files=dt.files;upload.dispatchEvent(new w.Event('change',{bubbles:true}));await wait(100);checks.audioUpload=c.audio.events.victory.custom.startsWith('data:audio/');$('[data-delete-sound="victory"]').click();$('#confirmKeep').click();checks.audioDeleteCancel=!!c.audio.events.victory.custom;$('[data-delete-sound="victory"]').click();$('#confirmDelete').click();checks.audioDelete=!c.audio.events.victory.custom;
await $('#lightenProject').onclick();checks.lightenFinishes=!$('#lightenProject').disabled&&$('#lightenProject').classList.contains('code-lightened');
result.textContent=(Object.values(checks).every(Boolean)?'PASS ':'FAIL ')+JSON.stringify(checks);
}catch(e){result.textContent='FAIL '+e.stack}};
</script>
