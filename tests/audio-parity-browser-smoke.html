<!doctype html><meta charset="utf-8"><title>Audio parity regression</title>
<iframe id="editor" src="../index.html"></iframe><pre id="result">RUNNING</pre>
<script>
const wait=ms=>new Promise(r=>setTimeout(r,ms));
function fakeAudio(){window.audioTrace=[];window.AudioContext=class{constructor(){this.currentTime=0;this.destination={}}resume(){return Promise.resolve()}createOscillator(){const trace={};audioTrace.push(trace);return{set type(v){trace.type=v},frequency:{setValueAtTime:(...v)=>trace.frequency=v,exponentialRampToValueAtTime:(...v)=>trace.slide=v},connect:g=>g,start:t=>trace.start=t,stop:t=>trace.stop=t}}createGain(){const trace=audioTrace.at(-1);return{gain:{setValueAtTime:(...v)=>trace.gain=v,exponentialRampToValueAtTime:(...v)=>trace.fade=v},connect:()=>({})}}}}
editor.onload=async()=>{try{await wait(350);const w=editor.contentWindow,d=editor.contentDocument,c=w.EditorV5.getConfig(),checks={};if(!d.querySelector('#restoreModal').hidden)d.querySelector('#restoreDelete').click();w.eval('('+fakeAudio.toString()+')()');c.audio.enabled=true;c.audio.volume=42;c.helper.duration=30;c.audio.events.helper.preset='none';c.audio.events.start.volume=37;
 for(const preset of Object.keys(w.__soundPresets)){c.audio.events.start.preset=preset;w.audioTrace.length=0;d.querySelector('[data-play="start"]').click();const expected=JSON.stringify(w.audioTrace),frame=document.createElement('iframe');frame.srcdoc=w.EditorV5.generateStandalone().replace('<script>','<script>('+fakeAudio.toString()+')();');document.body.append(frame);await new Promise(r=>frame.onload=r);frame.contentDocument.querySelector('#startGame').click();checks[preset]=expected===JSON.stringify(frame.contentWindow.audioTrace)&&w.audioTrace.length>0;frame.remove()}
 result.textContent=(Object.values(checks).every(Boolean)?'PASS ':'FAIL ')+JSON.stringify(checks);
}catch(e){result.textContent='FAIL '+e.stack}};
</script>
