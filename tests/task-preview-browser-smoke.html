<!doctype html><meta charset="utf-8"><title>Task preview regression</title>
<pre id="result">RUNNING</pre><script>
(async()=>{try{
 const checks={},wait=ms=>new Promise(r=>setTimeout(r,ms));
 for(const [name,url] of [['editor','../index.html'],['snapshot','../player-v20261003-taskfix1/index.html']]){
  const frame=document.createElement('iframe');frame.src=url;document.body.append(frame);await new Promise(r=>frame.onload=r);await wait(400);
  const w=frame.contentWindow,d=frame.contentDocument,api=w.EditorV5,c=api.getConfig();c.audio.enabled=false;
  if(!d.querySelector('#restoreModal').hidden)d.querySelector('#restoreDelete').click();
  for(const source of ['2+2? | 4* | 5','Чётные | 2* | 4* | 5','[ввод] Столица Франции | Париж','[порядок] По возрастанию | 1 | 2']){
   c.tasks=api.parseTasks(source).tasks;
   d.querySelector('[data-preview="task"]').click();
   const area=d.querySelector('#answerArea'),task=c.tasks[0];
   if(task.type==='input'){const input=d.querySelector('#textAnswerInput');input.value=' Париж ';input.dispatchEvent(new w.Event('input',{bubbles:true}));}
   else if(task.type==='order'){
    for(const answer of task.answers)area.append([...area.children].find(row=>row.dataset.id===answer.id));
   }else for(const input of area.querySelectorAll('input')){input.checked=input.dataset.correct==='1';input.dispatchEvent(new w.Event('change',{bubbles:true}));}
   await wait(10);d.querySelector('#checkAnswer').click();
   checks[name+'_'+task.type]=d.querySelector('#taskCard').classList.contains('correct')&&d.querySelector('#taskTypeLabel').hidden;
   d.querySelector('#continueGame').click();checks[name+'_'+task.type+'_retry']=!d.querySelector('#taskModal').hidden&&!d.querySelector('#checkAnswer').hidden;
  }
  frame.remove();
 }
 result.textContent=(Object.values(checks).every(Boolean)?'PASS ':'FAIL ')+JSON.stringify(checks);
}catch(e){result.textContent='FAIL '+e.stack}})();
</script>
