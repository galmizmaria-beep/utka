<!doctype html><meta charset="utf-8"><title>V8 browser smoke</title>
<iframe id="editor" src="../index.html?browser-smoke=1" style="width:1200px;height:800px"></iframe>
<pre id="result">RUNNING</pre>
<script>
const wait=ms=>new Promise(r=>setTimeout(r,ms));
editor.onload=async()=>{const d=editor.contentDocument,w=editor.contentWindow,checks={};await wait(100);const initialGameButton=d.querySelector('[data-preview="game"]'),initialGameStyle=getComputedStyle(initialGameButton);checks.initialGameButtonNeutral=!initialGameButton.classList.contains('active')&&initialGameStyle.backgroundColor!=='rgb(85, 189, 122)';
d.querySelector('[data-preview="helper"]').click();await wait(100);const art=d.querySelector('.helper-art');checks.helperSelected=art.classList.contains('helper-selected');checks.helperOutline=getComputedStyle(art).outlineStyle==='dashed';checks.resizeHandle=!!art.querySelector('.helper-resize-handle');
d.querySelector('[data-page="rounds"]').click();d.querySelector('[data-preview="round"]').click();await wait(30);const roundBg=d.querySelector('#v8RoundBackground');roundBg.value='#123456';roundBg.dispatchEvent(new Event('input',{bubbles:true}));await wait(60);const editorRoundTab=d.querySelector('.v8-round-tab.active'),editorRoundStyle=getComputedStyle(editorRoundTab),roundCard=d.querySelector('#roundIntroCard');checks.editorRoundTabIndependent=editorRoundStyle.backgroundColor!=='rgb(18, 52, 86)';checks.editorRoundTabHasNoInlineStyle=!editorRoundTab.hasAttribute('style');checks.roundBackground=getComputedStyle(roundCard).backgroundColor==='rgb(18, 52, 86)';checks.roundStylePreviewStatic=roundCard.className==='round-intro-card'&&roundCard.getAnimations().length===0;const enterAnimation=d.querySelector('#v8RoundEnterAnimation'),exitAnimation=d.querySelector('#v8RoundExitAnimation');checks.roundAnimationLibraries=enterAnimation.options.length>=10&&exitAnimation.options.length>=8&&enterAnimation.querySelector('[value="none"]')?.textContent==='Без анимации'&&exitAnimation.querySelector('[value="none"]')?.textContent==='Без анимации';enterAnimation.value='bounce';enterAnimation.dispatchEvent(new Event('change',{bubbles:true}));await wait(40);checks.roundEnterPreview=roundCard.classList.contains('round-enter-bounce')&&roundCard.getAnimations().length>0;exitAnimation.value='shrink';exitAnimation.dispatchEvent(new Event('change',{bubbles:true}));await wait(40);checks.roundExitPreview=roundCard.classList.contains('round-exit-shrink')&&roundCard.getAnimations().length>0;enterAnimation.value='none';enterAnimation.dispatchEvent(new Event('change',{bubbles:true}));await wait(40);checks.roundNoneAnimation=roundCard.className==='round-intro-card'&&roundCard.getAnimations().length===0;
d.querySelector('[data-preview="task"]').click();await wait(50);let answers=d.querySelectorAll('#answerArea input');const wrong=answers[answers.length-1];wrong.checked=true;wrong.dispatchEvent(new Event('change',{bubbles:true}));await wait(50);checks.selectionPersists=wrong.checked;d.querySelector('#checkAnswer').click();await wait(30);checks.retryAvailable=!d.querySelector('#checkAnswer').hidden;
const continueBg=d.querySelector('#v8ContinueBg'),continueGlow=d.querySelector('#v8ContinueGlowSize');continueBg.value='#112233';continueBg.dispatchEvent(new Event('input',{bubbles:true}));continueGlow.value='24';continueGlow.dispatchEvent(new Event('input',{bubbles:true}));await wait(80);const nextStyle=getComputedStyle(d.querySelector('#continueGame'));checks.continueBackground=nextStyle.backgroundColor==='rgb(17, 34, 51)';checks.continueGlow=nextStyle.boxShadow!=='none';checks.soundPresets=new Set(Object.values(w.__soundPresets).map(JSON.stringify)).size===10;
checks.helperImageControlsRemoved=!d.querySelector('#v5HelperBgUpload')&&!d.querySelector('#v5HelperBgFit')&&!d.querySelector('#v5HelperOverlay');checks.hudColorControlsRemoved=!d.querySelector('#roundHudBg')&&!d.querySelector('#roundHudFrame')&&!d.querySelector('#scoreHudBg')&&!d.querySelector('#scoreHudFrame');checks.duplicateTaskSourceHidden=d.querySelector('#taskSource').hidden;checks.targetPreviewButton=!!d.querySelector('[data-preview="target"]');checks.crosshairPreviewButton=!!d.querySelector('[data-preview="crosshair"]');checks.fontLibrary=d.querySelectorAll('#gameFont option').length>=20;
const roundSource=d.querySelector('#v8RoundTaskSource');roundSource.value='[ввод] Столица Франции | Париж';roundSource.dispatchEvent(new Event('input',{bubbles:true}));await wait(260);d.querySelector('[data-preview="task"]').click();await wait(40);checks.textAnswerType=!!d.querySelector('#textAnswerInput');const inputBg=d.querySelector('#v8InputAnswerBg');inputBg.value='#abcdef';inputBg.dispatchEvent(new Event('input',{bubbles:true}));await wait(30);checks.textAnswerBackground=getComputedStyle(d.querySelector('#textAnswerInput')).backgroundColor==='rgb(171, 205, 239)';d.querySelector('#textAnswerInput').value='  ПАРИЖ  ';d.querySelector('#checkAnswer').click();await wait(30);checks.textAnswerAccepted=d.querySelector('#taskCard').classList.contains('correct');
d.querySelector('[data-preview="target"]').click();await wait(20);const trajectory=d.querySelector('#trajectory');trajectory.value='bottom-up';trajectory.dispatchEvent(new Event('change',{bubbles:true}));await wait(40);const targetPreview=d.querySelector('#flyingTarget');checks.targetPreviewVisible=getComputedStyle(targetPreview).display==='grid';checks.targetTrajectoryPreview=targetPreview.dataset.previewTrajectory==='bottom-up'&&targetPreview.getAnimations().length>0;checks.animatedTargetCharacter=!!targetPreview.querySelector('.target-character.target-art-animated[data-motion] picture img');const profileEntries=Object.entries(w.__targetProfiles||{}),voiced=[...(w.__voicedTargets||[])].sort();checks.targetVoiceLibrary=profileEntries.length>=97&&JSON.stringify(voiced)===JSON.stringify(['cat','duck','frog','goose','peacock'])&&profileEntries.filter(([,profile])=>profile.voice?.url).every(([kind])=>voiced.includes(kind))&&profileEntries.filter(([,profile])=>profile.voice?.url).length===5;checks.targetVoiceControls=!!d.querySelector('#targetVoiceEnabled')&&!!d.querySelector('#targetVoiceVolume')&&!!d.querySelector('#targetVoiceName');const category=d.querySelector('#targetCategory');category.value='fruits';category.dispatchEvent(new Event('change',{bubbles:true}));await wait(30);checks.newAnimatedTargetCategories=d.querySelectorAll('#targets .asset-card').length===10&&[...d.querySelectorAll('#targets .asset-card')].every(card=>card.querySelector('picture img'));d.querySelector('#targets [data-target="strawberry"]').click();await wait(20);checks.unvoicedTargetDisablesSound=d.querySelector('#targetVoiceName').textContent==='Без озвучки'&&d.querySelector('#targetVoiceEnabled').disabled&&d.querySelector('#targetVoiceVolume').disabled;
d.querySelector('[data-preview="crosshair"]').click();await wait(20);d.querySelector('[data-crosshair="star"]').click();const crossSize=d.querySelector('#v6CrosshairSize'),crossWidth=d.querySelector('#v6CrosshairWidth'),crossColor=d.querySelector('#v6CrosshairColor'),crossGlow=d.querySelector('#v6CrosshairGlow');crossSize.value='118';crossWidth.value='7';crossColor.value='#123456';crossGlow.value='#abcdef';[crossSize,crossWidth,crossColor,crossGlow].forEach(x=>x.dispatchEvent(new Event('input',{bubbles:true})));await wait(50);const cross=d.querySelector('#crosshair');checks.crosshairPreviewVisible=getComputedStyle(cross).display==='block';checks.crosshairPreviewUpdates=cross.classList.contains('star')&&cross.style.getPropertyValue('--cross-size')==='118px'&&cross.style.getPropertyValue('--cross-width')==='7px'&&cross.style.getPropertyValue('--cross')==='#123456'&&w.EditorV5.getConfig().crosshair.glow==='#abcdef'&&getComputedStyle(cross).filter!=='none';
d.querySelector('[data-preview="game"]').click();await wait(60);checks.gameButtonStartsFullTest=d.querySelector('#gameStage').classList.contains('testing')&&d.querySelector('#modeBadge').textContent==='Тест игры';checks.progressStartsAtZero=d.querySelector('#taskProgressValue').textContent==='0 / 1';const shotTarget=d.querySelector('#flyingTarget');shotTarget.click();await wait(100);checks.targetFallsBeforeTask=shotTarget.classList.contains('target-shot')&&shotTarget.getAnimations().length>0&&d.querySelector('#taskModal').hidden;await wait(720);const liveInput=d.querySelector('#textAnswerInput');if(liveInput){liveInput.value='Париж';d.querySelector('#checkAnswer').click();await wait(30)}checks.completedTaskProgress=d.querySelector('#taskProgressValue').textContent==='1 / 1';checks.completedLabel=d.querySelector('#taskProgressLabel').textContent==='ВЫПОЛНЕНО';
const failed=Object.entries(checks).filter(([,ok])=>!ok);result.textContent=(failed.length?'FAIL ':'PASS ')+JSON.stringify(checks);document.body.dataset.status=failed.length?'fail':'pass';w.stop();};
</script>
