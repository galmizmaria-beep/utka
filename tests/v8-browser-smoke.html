<!doctype html><meta charset="utf-8"><title>V8 browser smoke</title>
<iframe id="editor" src="../index.html?browser-smoke=1" style="width:1200px;height:800px"></iframe>
<pre id="result">RUNNING</pre>
<script>
const wait=ms=>new Promise(r=>setTimeout(r,ms));
editor.onload=async()=>{const d=editor.contentDocument,w=editor.contentWindow,checks={};await wait(100);
d.querySelector('[data-preview="helper"]').click();await wait(100);const art=d.querySelector('.helper-art');checks.helperSelected=art.classList.contains('helper-selected');checks.helperOutline=getComputedStyle(art).outlineStyle==='dashed';checks.resizeHandle=!!art.querySelector('.helper-resize-handle');
d.querySelector('[data-page="rounds"]').click();const roundBg=d.querySelector('#v8RoundBackground');roundBg.value='#123456';roundBg.dispatchEvent(new Event('input',{bubbles:true}));await wait(20);const editorRoundTab=d.querySelector('.v8-round-tab.active'),editorRoundStyle=getComputedStyle(editorRoundTab);checks.editorRoundTabIndependent=editorRoundStyle.backgroundColor!=='rgb(18, 52, 86)';checks.editorRoundTabHasNoInlineStyle=!editorRoundTab.hasAttribute('style');d.querySelector('[data-preview="round"]').click();await wait(60);checks.roundBackground=getComputedStyle(d.querySelector('#roundIntroCard')).backgroundColor==='rgb(18, 52, 86)';
d.querySelector('[data-preview="task"]').click();await wait(50);let answers=d.querySelectorAll('#answerArea input');const wrong=answers[answers.length-1];wrong.checked=true;wrong.dispatchEvent(new Event('change',{bubbles:true}));await wait(50);checks.selectionPersists=wrong.checked;d.querySelector('#checkAnswer').click();await wait(30);checks.retryAvailable=!d.querySelector('#checkAnswer').hidden;
const continueBg=d.querySelector('#v8ContinueBg'),continueGlow=d.querySelector('#v8ContinueGlowSize');continueBg.value='#112233';continueBg.dispatchEvent(new Event('input',{bubbles:true}));continueGlow.value='24';continueGlow.dispatchEvent(new Event('input',{bubbles:true}));await wait(80);const nextStyle=getComputedStyle(d.querySelector('#continueGame'));checks.continueBackground=nextStyle.backgroundColor==='rgb(17, 34, 51)';checks.continueGlow=nextStyle.boxShadow!=='none';checks.soundPresets=new Set(Object.values(w.__soundPresets).map(JSON.stringify)).size===10;
checks.helperImageControlsRemoved=!d.querySelector('#v5HelperBgUpload')&&!d.querySelector('#v5HelperBgFit')&&!d.querySelector('#v5HelperOverlay');checks.hudColorControlsRemoved=!d.querySelector('#roundHudBg')&&!d.querySelector('#roundHudFrame')&&!d.querySelector('#scoreHudBg')&&!d.querySelector('#scoreHudFrame');checks.duplicateTaskSourceHidden=d.querySelector('#taskSource').hidden;checks.targetPreviewButton=!!d.querySelector('[data-preview="target"]');checks.crosshairPreviewButton=!!d.querySelector('[data-preview="crosshair"]');checks.fontLibrary=d.querySelectorAll('#gameFont option').length>=20;
const roundSource=d.querySelector('#v8RoundTaskSource');roundSource.value='[ввод] Столица Франции | Париж';roundSource.dispatchEvent(new Event('input',{bubbles:true}));await wait(260);d.querySelector('[data-preview="task"]').click();await wait(40);checks.textAnswerType=!!d.querySelector('#textAnswerInput');const inputBg=d.querySelector('#v8InputAnswerBg');inputBg.value='#abcdef';inputBg.dispatchEvent(new Event('input',{bubbles:true}));await wait(30);checks.textAnswerBackground=getComputedStyle(d.querySelector('#textAnswerInput')).backgroundColor==='rgb(171, 205, 239)';d.querySelector('#textAnswerInput').value='  ПАРИЖ  ';d.querySelector('#checkAnswer').click();await wait(30);checks.textAnswerAccepted=d.querySelector('#taskCard').classList.contains('correct');
d.querySelector('[data-preview="target"]').click();await wait(20);checks.targetPreviewVisible=getComputedStyle(d.querySelector('#flyingTarget')).display==='grid';d.querySelector('[data-preview="crosshair"]').click();await wait(20);checks.crosshairPreviewVisible=getComputedStyle(d.querySelector('#crosshair')).display==='block';d.querySelector('[data-preview="game"]').click();await wait(60);checks.gameButtonStartsFullTest=d.querySelector('#gameStage').classList.contains('testing')&&d.querySelector('#modeBadge').textContent==='Тест игры';
const failed=Object.entries(checks).filter(([,ok])=>!ok);result.textContent=(failed.length?'FAIL ':'PASS ')+JSON.stringify(checks);document.body.dataset.status=failed.length?'fail':'pass';w.stop();};
</script>
