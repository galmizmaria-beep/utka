<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Duck Hunt Editor Pro - Гальмиз М.А.</title>
    <style>
        :root { --primary: #4CAF50; --dark: #2c3e50; --light: #ecf0f1; --border: #bdc3c7; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; display: flex; height: 100vh; background: var(--light); overflow: hidden; }
        
        .editor-panel { width: 420px; background: white; border-right: 1px solid var(--border); display: flex; flex-direction: column; box-shadow: 2px 0 5px rgba(0,0,0,0.1); z-index: 10; }
        .preview-panel { flex: 1; display: flex; flex-direction: column; background: #34495e; }
        .settings-container { flex: 1; overflow-y: auto; padding: 20px; }
        
        .header { padding: 15px 20px; background: var(--dark); color: white; font-weight: bold; font-size: 1.2rem; }
        .footer { padding: 10px 20px; background: var(--dark); color: #bdc3c7; font-size: 0.8rem; text-align: center; border-top: 1px solid #1a252f; }
        
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: 600; color: var(--dark); font-size: 0.9rem; }
        input[type="text"], input[type="number"], select, textarea { width: 100%; padding: 8px; border: 1px solid var(--border); border-radius: 4px; box-sizing: border-box; }
        input[type="range"] { width: 100%; }
        input[type="color"] { width: 40px; height: 30px; padding: 0; border: none; cursor: pointer; vertical-align: middle; border-radius: 4px; }
        .color-wrapper { display: flex; align-items: center; gap: 10px; }
        .range-value { float: right; font-size: 0.8rem; color: #7f8c8d; }
        
        .section-title { margin-top: 20px; margin-bottom: 10px; padding-bottom: 5px; border-bottom: 2px solid var(--primary); color: var(--primary); font-size: 1rem; display: flex; align-items: center; gap: 10px; }
        
        .btn-group { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 15px 20px; background: #f8f9fa; border-top: 1px solid var(--border); }
        button { padding: 10px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .btn-primary { background: var(--primary); color: white; } .btn-primary:hover { background: #45a049; }
        .btn-secondary { background: #3498db; color: white; } .btn-secondary:hover { background: #2980b9; }
        .btn-dark { background: var(--dark); color: white; } .btn-dark:hover { background: #1a252f; }
        .btn-full { grid-column: span 2; }
        
        iframe { width: 100%; height: 100%; border: none; background: black; }
        
        .task-item { background: #f1f2f6; padding: 10px; border-radius: 4px; margin-bottom: 10px; border-left: 4px solid var(--primary); position: relative; }
        .task-item input, .task-item select { margin-top: 5px; }
        .remove-task { color: red; cursor: pointer; position: absolute; top: 10px; right: 10px; font-weight: bold; }
        
        .checkbox-wrapper { display: flex; align-items: center; gap: 8px; margin-bottom: 15px; background: #e8f6f3; padding: 10px; border-radius: 4px; border: 1px solid #d1f2eb; }
        .checkbox-wrapper input { width: 18px; height: 18px; cursor: pointer; }
        .checkbox-wrapper label { margin: 0; cursor: pointer; color: #16a085; }
    </style>
</head>
<body>

    <div class="editor-panel">
        <div class="header">🦆 Duck Hunt Editor Pro</div>
        <div class="settings-container">
            
            <div class="section-title">🎨 Медиа файлы</div>
            <div class="form-group"><label>Фон игры</label><input type="file" id="bgImage" accept="image/*"></div>
            <div class="form-group"><label>Утка</label><input type="file" id="duckImage" accept="image/*"></div>
            <div class="form-group"><label>Помощник (Собака)</label><input type="file" id="dogImage" accept="image/*"></div>
            <div class="form-group"><label>Звук выстрела</label><input type="file" id="shootSound" accept="audio/*"></div>

            <div class="section-title">
                <input type="checkbox" id="useStartScreen" checked style="width:16px; height:16px;">
                <label for="useStartScreen" style="margin:0; border:none; color:var(--primary);">Титульный экран</label>
            </div>
            <div id="startScreenSettings">
                <div class="form-group"><label>Название игры</label><input type="text" id="gameTitleText" value="Охота на уток"></div>
                <div class="form-group"><label>Текст кнопки</label><input type="text" id="startBtnText" value="Играть"></div>
                <div class="form-group">
                    <label>Фон окна (Цвет + Прозрачность) <span class="range-value" id="valStartBgOpacity">0.9</span></label>
                    <div class="color-wrapper"><input type="color" id="startBgColor" value="#ffffff"><input type="range" id="startBgOpacity" min="0" max="1" step="0.1" value="0.9" style="flex:1;"></div>
                </div>
                <div class="form-group">
                    <label>Рамка окна</label>
                    <div class="color-wrapper"><input type="number" id="startBorderWidth" value="4" min="0" max="20" style="width:60px;"><input type="color" id="startBorderColor" value="#4CAF50"></div>
                </div>
                <div class="form-group"><label>Цвет названия</label><input type="color" id="titleColor" value="#2c3e50"></div>
                <div class="form-group"><label>Размер названия (px) <span class="range-value" id="valTitleSize">32</span></label><input type="range" id="titleSize" min="10" max="60" value="32"></div>
                <div class="form-group"><label>Цвет кнопки</label><input type="color" id="btnColor" value="#4CAF50"></div>
                <div class="form-group"><label>Цвет текста кнопки</label><input type="color" id="btnTextColor" value="#ffffff"></div>
            </div>

            <div class="section-title">📝 Настройки заданий</div>
            <div class="form-group"><label>Цвет текста вопроса</label><input type="color" id="qTextColor" value="#333333"></div>
            <div class="form-group"><label>Размер вопроса (px) <span class="range-value" id="valQuestionSize">20</span></label><input type="range" id="questionSize" min="10" max="40" value="20"></div>
            <div class="form-group"><label>Размер ответа (px) <span class="range-value" id="valAnswerSize">18</span></label><input type="range" id="answerSize" min="10" max="40" value="18"></div>
            <div class="form-group">
                <label>Рамка и свечение окна задания</label>
                <div class="color-wrapper"><input type="color" id="qBorderColor" value="#4CAF50" title="Рамка"><input type="color" id="qGlowColor" value="#4CAF50" title="Свечение"></div>
            </div>

            <div class="section-title">⚙️ Геймплей</div>
            <div class="form-group"><label>Шрифт</label><select id="fontFamily"><option value="'Segoe UI', sans-serif">Segoe UI</option><option value="'Comic Sans MS', cursive">Comic Sans MS</option><option value="'Arial', sans-serif">Arial</option></select></div>
            <div class="form-group"><label>Язык</label><select id="language"><option value="ru">Русский</option><option value="en">English</option><option value="es">Español</option></select></div>
            <div class="form-group"><label>Размер прицела <span class="range-value" id="valCrosshairSize">60</span></label><input type="range" id="crosshairSize" min="20" max="150" value="60"></div>
            <div class="form-group"><label>Количество уток <span class="range-value" id="valDuckCount">10</span></label><input type="range" id="duckCount" min="1" max="20" value="10"></div>
            <div class="form-group"><label>Таймер (сек, 0=выкл) <span class="range-value" id="valTimer">0</span></label><input type="range" id="timer" min="0" max="60" value="0"></div>
            <div class="form-group"><label>Жизни <span class="range-value" id="valLives">3</span></label><input type="range" id="lives" min="1" max="10" value="3"></div>
            <div class="form-group"><label>Эмодзи жизни</label><select id="lifeEmoji"><option value="❤️">❤️</option><option value="🦆">🦆</option><option value="⭐">⭐</option><option value="🔫">🔫</option></select></div>

            <div class="section-title">📋 Задания</div>
            <div id="tasksList"></div>
            <button class="btn-secondary btn-full" onclick="addTask()" style="margin-bottom: 10px;">+ Добавить задание</button>
        </div>

        <div class="btn-group">
            <button class="btn-dark" onclick="saveProject()">💾 Сохранить</button>
            <button class="btn-dark" onclick="document.getElementById('loadProjectInput').click()">📂 Загрузить</button>
            <input type="file" id="loadProjectInput" accept=".json" style="display:none" onchange="loadProject(event)">
            <button class="btn-primary" onclick="copyGeniallyCode()">📋 Код Genially</button>
            <button class="btn-secondary" onclick="downloadHTML()">⬇️ Скачать HTML</button>
        </div>
        <div class="footer">Автор: Гальмиз Мария Александровна</div>
    </div>

    <div class="preview-panel"><iframe id="previewFrame"></iframe></div>

    <script>
        let state = {
            bgImage: '', duckImage: '', dogImage: '', shootSound: '',
            useStartScreen: true, gameTitleText: 'Охота на уток', startBtnText: 'Играть',
            startBgColor: '#ffffff', startBgOpacity: 0.9, startBorderWidth: 4, startBorderColor: '#4CAF50',
            titleColor: '#2c3e50', titleSize: 32, btnColor: '#4CAF50', btnTextColor: '#ffffff',
            qTextColor: '#333333', questionSize: 20, answerSize: 18, qBorderColor: '#4CAF50', qGlowColor: '#4CAF50',
            fontFamily: "'Segoe UI', sans-serif", language: 'ru', crosshairSize: 60, duckCount: 10, timer: 0, lives: 3, lifeEmoji: '❤️',
            tasks: []
        };

        const translations = {
            ru: { round: "РАУНД", score: "СЧЕТ", correct: "Верно!", wrong: "Ошибка!", gameOver: "Игра окончена", next: "Далее", submit: "Ответить" },
            en: { round: "ROUND", score: "SCORE", correct: "Correct!", wrong: "Wrong!", gameOver: "Game Over", next: "Next", submit: "Submit" },
            es: { round: "RONDA", score: "PUNTOS", correct: "¡Correcto!", wrong: "¡Error!", gameOver: "Juego terminado", next: "Siguiente", submit: "Responder" }
        };

        function init() {
            document.querySelectorAll('input, select').forEach(el => {
                if(el.id === 'loadProjectInput' || el.type === 'file') return;
                el.addEventListener('input', e => {
                    if(e.target.type === 'range') {
                        const v = document.getElementById('val' + e.target.id.charAt(0).toUpperCase() + e.target.id.slice(1));
                        if(v) v.innerText = e.target.value;
                    }
                    updateState();
                });
                el.addEventListener('change', e => {
                    if(e.target.type === 'file') handleFile(e, e.target.id);
                    else updateState();
                });
            });
            document.getElementById('useStartScreen').addEventListener('change', e => {
                document.getElementById('startScreenSettings').style.display = e.target.checked ? 'block' : 'none';
                updateState();
            });
            addTask();
        }

        function updateState() {
            document.querySelectorAll('input:not([type=file]), select').forEach(el => {
                if(!el.id) return;
                state[el.id] = el.type === 'checkbox' ? el.checked : (el.type === 'number' || el.type === 'range' ? parseFloat(el.value) : el.value);
            });
            clearTimeout(window.pt); window.pt = setTimeout(updatePreview, 300);
        }

        function handleFile(e, key) {
            const f = e.target.files[0];
            if(f) { const r = new FileReader(); r.onload = () => { state[key] = r.result; updatePreview(); }; r.readAsDataURL(f); }
        }

        function addTask() {
            state.tasks.push({ id: Date.now()+Math.random(), type: 'input', question: 'Сколько будет 2+2?', answer: '4', options: '' });
            renderTasks(); updateState();
        }
        function removeTask(id) { state.tasks = state.tasks.filter(t => t.id != id); renderTasks(); updateState(); }
        function updateTaskType(id, val) { let t = state.tasks.find(x => x.id == id); if(t){t.type=val; renderTasks(); updateState();} }
        function updateTask(id, field, val) { let t = state.tasks.find(x => x.id == id); if(t){t[field]=val; updateState();} }

        function renderTasks() {
            const c = document.getElementById('tasksList'); c.innerHTML = '';
            state.tasks.forEach((t, i) => {
                let spec = '';
                if(t.type==='input') spec = `<input type="text" value="${t.answer}" oninput="updateTask('${t.id}','answer',this.value)" placeholder="Ответ">`;
                else if(t.type==='multiple') spec = `<input type="text" value="${t.options}" oninput="updateTask('${t.id}','options',this.value)" placeholder="Варианты (через запятую)"><input type="text" value="${t.answer}" oninput="updateTask('${t.id}','answer',this.value)" placeholder="Правильный вариант">`;
                else if(t.type==='order') spec = `<input type="text" value="${t.answer}" oninput="updateTask('${t.id}','answer',this.value)" placeholder="Порядок (через запятую)">`;
                
                c.innerHTML += `<div class="task-item"><span class="remove-task" onclick="removeTask('${t.id}')">✖</span><b>Задание ${i+1}</b>
                    <select onchange="updateTaskType('${t.id}',this.value)"><option value="input" ${t.type=='input'?'selected':''}>Ввод</option><option value="multiple" ${t.type=='multiple'?'selected':''}>Выбор</option><option value="oral" ${t.type=='oral'?'selected':''}>Устный</option><option value="order" ${t.type=='order'?'selected':''}>Порядок</option></select>
                    <input type="text" value="${t.question}" oninput="updateTask('${t.id}','question',this.value)" placeholder="Вопрос">${spec}</div>`;
            });
        }

        function updatePreview() { document.getElementById('previewFrame').srcdoc = generateGame(state); }
        function saveProject() { const a=document.createElement('a'); a.href="data:text/json;charset=utf-8,"+encodeURIComponent(JSON.stringify(state)); a.download="project.json"; a.click(); }
        function loadProject(e) { const f=e.target.files[0]; if(!f)return; const r=new FileReader(); r.onload=ev=>{ try{ state=JSON.parse(ev.target.result); for(let k in state){ let el=document.getElementById(k); if(el){ el.type=='checkbox'?el.checked=state[k]:el.value=state[k]; if(el.type=='range'){let v=document.getElementById('val'+k.charAt(0).toUpperCase()+k.slice(1)); if(v)v.innerText=state[k];}}} document.getElementById('startScreenSettings').style.display=state.useStartScreen?'block':'none'; renderTasks(); updatePreview(); alert('Загружено!'); }catch(err){alert('Ошибка');} }; r.readAsText(f); }
        function copyGeniallyCode() { navigator.clipboard.writeText(generateGame(state)).then(()=>alert('Скопировано для Genially!')); }
        function downloadHTML() { const b=new Blob([generateGame(state)],{type:'text/html'}); const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download='game.html'; a.click(); }

        // --- ГЕНЕРАТОР ИГРЫ (БЕЗОПАСНЫЙ ОТ SCRIPT TAGS) ---
        function generateGame(c) {
            const t = translations[c.language] || translations.ru;
            const hex2rgba = (h, a) => { let r=parseInt(h.slice(1,3),16),g=parseInt(h.slice(3,5),16),b=parseInt(h.slice(5,7),16); return `rgba(${r},${g},${b},${a})`; };
            const sBg = hex2rgba(c.startBgColor, c.startBgOpacity);
            
            let h = [];
            h.push('<!DOCTYPE html><html><head><meta charset="UTF-8"><style>');
            h.push(`body{margin:0;overflow:hidden;font-family:${c.fontFamily};background:#87CEEB;user-select:none}#gc{position:relative;width:100vw;height:100vh;overflow:hidden;cursor:none}`);
            h.push(`#bg{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;z-index:1}#ui{position:absolute;top:0;left:0;width:100%;height:100%;z-index:10;pointer-events:none}`);
            h.push(`.ht{display:flex;justify-content:space-between;padding:20px;color:white;text-shadow:2px 2px 0 #000;font-weight:bold;font-size:${c.titleSize*0.6}px}#ld{font-size:${c.titleSize*0.8}px;letter-spacing:5px}`);
            h.push(`#bp{position:absolute;bottom:0;width:100%;height:80px;background:rgba(101,67,33,.9);border-top:4px solid #3e2723;display:flex;align-items:center;justify-content:center;z-index:10;pointer-events:none}.di{width:30px;height:30px;margin:0 5px;opacity:1;transition:.3s}.di.dead{opacity:.2;filter:grayscale(1)}`);
            h.push(`#ch{position:absolute;width:${c.crosshairSize}px;height:${c.crosshairSize}px;pointer-events:none;z-index:100;transform:translate(-50%,-50%);display:none}#ch::before,#ch::after{content:'';position:absolute;background:black;border:1px solid white}#ch::before{top:50%;left:0;width:100%;height:2px;transform:translateY(-50%)}#ch::after{left:50%;top:0;height:100%;width:2px;transform:translateX(-50%)}#cc{position:absolute;top:10%;left:10%;width:80%;height:80%;border:2px solid black;border-radius:50%;box-shadow:0 0 0 1px white inset}`);
            h.push(`.dk{position:absolute;width:80px;height:80px;z-index:5;cursor:none}.dk img{width:100%;height:100%;object-fit:contain;pointer-events:none}#dg{position:absolute;bottom:80px;left:-150px;width:120px;height:120px;z-index:6;transition:left .5s}#dg img{width:100%;height:100%;object-fit:contain}#dg.laugh{animation:la .5s infinite alternate}@keyframes la{from{transform:translateY(0)}to{transform:translateY(-10px) rotate(5deg)}}`);
            h.push(`.mo{position:absolute;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.7);z-index:200;display:flex;justify-content:center;align-items:center;pointer-events:auto}.mb{background:${sBg};padding:30px;border-radius:10px;max-width:500px;width:90%;text-align:center;border:${c.startBorderWidth}px solid ${c.startBorderColor};box-shadow:0 0 20px ${c.qGlowColor}}`);
            h.push(`#qm .mb{border-color:${c.qBorderColor};box-shadow:0 0 25px ${c.qGlowColor};background:rgba(255,255,255,.95)}.mt{font-size:${c.titleSize}px;color:${c.titleColor};margin-bottom:20px}.mq{font-size:${c.questionSize}px;margin-bottom:20px;color:${c.qTextColor}}`);
            h.push(`.mi{width:100%;padding:10px;font-size:${c.answerSize}px;margin-bottom:15px;border:2px solid #ccc;border-radius:5px;box-sizing:border-box}.mbtn{background:${c.btnColor};color:${c.btnTextColor};border:none;padding:12px 24px;font-size:${c.answerSize}px;border-radius:5px;cursor:pointer}.mbtn:hover{opacity:.9}`);
            h.push(`.fb{font-size:${c.questionSize}px;font-weight:bold;margin-top:15px;min-height:24px}.fb.s{color:green}.fb.e{color:red}.mco{display:flex;flex-direction:column;gap:10px;margin-bottom:15px}.mcb{padding:10px;border:2px solid #ccc;background:#f9f9f9;border-radius:5px;cursor:pointer;font-size:${c.answerSize}px;color:${c.qTextColor}}.mcb.sel{border-color:${c.qBorderColor};background:#e8f5e9}`);
            h.push(`.ol{list-style:none;padding:0;margin-bottom:15px}.oi{padding:10px;margin:5px 0;background:#f0f0f0;border:1px solid #ccc;border-radius:4px;cursor:grab;font-size:${c.answerSize}px;color:${c.qTextColor}}#tb{width:100%;height:5px;background:#eee;margin-top:10px;border-radius:3px;overflow:hidden;display:none}#tf{height:100%;background:#e74c3c;width:100%;transition:width linear}.hid{display:none!important}`);
            h.push('</style></head><body><div id="gc">');
            if(c.bgImage) h.push(`<img id="bg" src="${c.bgImage}">`);
            h.push(`<div id="ui"><div class="ht"><div>${t.round}: <span id="rv">1</span></div><div id="ld"></div><div>${t.score}: <span id="sv">0</span></div></div></div><div id="bp"></div><div id="ch"><div id="cc"></div></div><div id="dg" class="hid">${c.dogImage?`<img src="${c.dogImage}">`:'<div style="font-size:80px">🐕</div>'}</div>`);
            if(c.useStartScreen) h.push(`<div id="ss" class="mo"><div class="mb"><div class="mt">${c.gameTitleText}</div><button class="mbtn" onclick="startGame()">${c.startBtnText}</button></div></div>`);
            h.push(`<div id="qm" class="mo hid"><div class="mb"><div class="mq" id="qt"></div><div id="qc"></div><div id="tb"><div id="tf"></div></div><button class="mbtn" id="qs" onclick="checkAns()">${t.submit}</button><div class="fb" id="qf"></div></div></div>`);
            h.push(`<div id="go" class="mo hid"><div class="mb"><div class="mt">${t.gameOver}</div><div class="mq">${t.score}: <span id="fs">0</span></div><button class="mbtn" onclick="location.reload()">${c.startBtnText}</button></div></div></div>`);
            if(c.shootSound) h.push(`<audio id="as" src="${c.shootSound}"></audio>`);
            
            // JS Game Logic injected safely
            h.push('<' + 'script>');
            h.push(`const C=${JSON.stringify(c)},T=${JSON.stringify(t)};let sc=0,lv=C.lv,dr=C.dc,cd=null,ti=0,ip=false,tint=null,daf=null;`);
            h.push(`const gc=document.getElementById('gc'),ch=document.getElementById('ch'),ld=document.getElementById('ld'),sv=document.getElementById('sv'),bp=document.getElementById('bp'),dg=document.getElementById('dg'),as=document.getElementById('as'),ss=document.getElementById('ss'),qm=document.getElementById('qm'),qt=document.getElementById('qt'),qc=document.getElementById('qc'),qf=document.getElementById('qf'),qs=document.getElementById('qs'),tb=document.getElementById('tb'),tf=document.getElementById('tf'),go=document.getElementById('go');`);
            h.push(`function initHUD(){ld.innerText=Array(lv).fill(C.le).join('');bp.innerHTML='';for(let i=0;i<C.dc;i++){let d=document.createElement('div');d.className='di';d.innerHTML=C.duI?\`<img src="\${C.duI}">\`:'🦆';bp.appendChild(d);}}`);
            h.push(`gc.addEventListener('mousemove',e=>{ch.style.left=e.clientX+'px';ch.style.top=e.clientY+'px';});`);
            h.push(`gc.addEventListener('mousedown',e=>{if(!ip||!cd)return;if(as&&as.src){as.currentTime=0;as.play().catch(()=>{});}ch.style.transform='translate(-50%,-50%) scale(.8)';setTimeout(()=>ch.style.transform='translate(-50%,-50%) scale(1)',100);let r=cd.getBoundingClientRect();if(e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom)hitDuck();});`);
            h.push(`function startGame(){if(ss)ss.classList.add('hid');ch.style.display='block';initHUD();ip=true;spawnDuck();}`);
            if(!c.useStartScreen) h.push(`setTimeout(startGame,100);`);
            h.push(`function spawnDuck(){if(dr<=0||lv<=0){endGame();return;}if(cd)cd.remove();cd=document.createElement('div');cd.className='dk';cd.innerHTML=C.duI?\`<img src="\${C.duI}">\`:'🦆';gc.appendChild(cd);let x=Math.random()*(innerWidth-100),y=innerHeight-150,vx=(Math.random()-.5)*4,vy=-(Math.random()*3+2);cd.style.left=x+'px';cd.style.top=y+'px';if(vx<0)cd.style.transform='scaleX(-1)';function anim(){if(!cd)return;x+=vx;y+=vy;vy+=.05;if(x<0||x>innerWidth-80)vx*=-1;if(y<0)vy*=-1;if(y>innerHeight-150){missDuck();return;}cd.style.left=x+'px';cd.style.top=y+'px';cd.style.transform=vx<0?'scaleX(-1)':'scaleX(1)';daf=requestAnimationFrame(anim);}anim();}`);
            h.push(`function hitDuck(){cancelAnimationFrame(daf);cd.style.transition='top .5s,opacity .5s';cd.style.top=innerHeight+'px';cd.style.opacity='0';setTimeout(()=>{if(cd)cd.remove();cd=null;showQ();},500);}`);
            h.push(`function missDuck(){cancelAnimationFrame(daf);if(cd)cd.remove();cd=null;dg.classList.remove('hid');dg.style.left=(innerWidth/2-60)+'px';dg.classList.add('laugh');loseLife();setTimeout(()=>{dg.classList.remove('laugh');dg.style.left='-150px';setTimeout(()=>dg.classList.add('hid'),500);if(lv>0)spawnDuck();},1500);}`);
            h.push(`function loseLife(){lv--;ld.innerText=Array(Math.max(0,lv)).fill(C.le).join('');if(lv<=0)endGame();}`);
            h.push(`let ca='',smc=null;function showQ(){ip=false;ch.style.display='none';let tk=C.ts[ti%C.ts.length];ti++;if(!tk){handleC();return;}qt.innerText=tk.q;qf.innerText='';qf.className='fb';qc.innerHTML='';smc=null;ca=tk.a;if(tk.t==='input'){qc.innerHTML=\`<input type="text" class="mi" id="ai" autocomplete="off">\`;qs.classList.remove('hid');qs.innerText=T.sb;setTimeout(()=>document.getElementById('ai').focus(),100);}else if(tk.t==='multiple'){qs.classList.add('hid');let op=tk.o.split(',').map(o=>o.trim());let h='<div class="mco">';op.forEach(o=>h+=\`<div class="mcb" onclick="selMC(this,'\${o.replace(/'/g,"\\\\'")}')">\${o}</div>\`);h+='</div>';qc.innerHTML=h;}else if(tk.t==='oral'){qs.classList.remove('hid');qs.innerText=T.nx;qc.innerHTML=\`<p style="color:#7f8c8d;font-size:.9em">(Устный ответ)</p>\`;ca='ORAL';}else if(tk.t==='order'){qs.classList.remove('hid');qs.innerText=T.sb;let it=tk.a.split(',').map(o=>o.trim());let sh=[...it].sort(()=>Math.random()-.5);let h='<ul class="ol" id="ol">';sh.forEach(i=>h+=\`<li class="oi" draggable="true" data-v="\${i}">\${i}</li>\`);h+='</ul>';qc.innerHTML=h;initDD();}qm.classList.remove('hid');if(C.tm>0){tb.style.display='block';tf.style.width='100%';tf.style.transition='none';setTimeout(()=>{tf.style.transition=\`width \${C.tm}s linear\`;tf.style.width='0%';},50);clearTimeout(tint);tint=setTimeout(()=>{if(!qm.classList.contains('hid'))handleW();},C.tm*1000);}else tb.style.display='none';}`);
            h.push(`function selMC(el,v){document.querySelectorAll('.mcb').forEach(b=>b.classList.remove('sel'));el.classList.add('sel');smc=v;checkAns();}`);
            h.push(`function initDD(){let l=document.getElementById('ol'),di=null;l.addEventListener('dragstart',e=>{di=e.target;setTimeout(()=>e.target.style.display='none',0);});l.addEventListener('dragend',e=>{setTimeout(()=>{di.style.display='block';di=null;},0);});l.addEventListener('dragover',e=>{e.preventDefault();let a=gDAE(l,e.clientY);if(a==null)l.appendChild(di);else l.insertBefore(di,a);});}function gDAE(c,y){let e=[...c.querySelectorAll('.oi:not(.dragging)')];return e.reduce((cl,ch)=>{let b=ch.getBoundingClientRect(),o=y-b.top-b.height/2;if(o<0&&o>cl.o)return{o:o,e:ch};else return cl;},{o:Number.NEGATIVE_INFINITY}).e;}`);
            h.push(`function checkAns(){clearTimeout(tint);let ua='';let tk=C.ts[(ti-1)%C.ts.length];if(tk.t==='input')ua=document.getElementById('ai').value.trim();else if(tk.t==='multiple')ua=smc;else if(tk.t==='oral')ua='ORAL';else if(tk.t==='order')ua=[...document.querySelectorAll('.oi')].map(i=>i.dataset.v).join(',');if(String(ua).toLowerCase()===String(ca).toLowerCase())handleC();else handleW();}`);
            h.push(`function handleC(){qf.innerText=T.cr;qf.className='fb s';sc+=10;sv.innerText=sc;let ic=document.querySelectorAll('.di');if(ic[C.dc-dr])ic[C.dc-dr].classList.add('dead');dr--;setTimeout(()=>{qm.classList.add('hid');ip=true;ch.style.display='block';spawnDuck();},1000);}`);
            h.push(`function handleW(){qf.innerText=T.wr;qf.className='fb e';loseLife();setTimeout(()=>{qm.classList.add('hid');if(lv>0){ip=true;ch.style.display='block';spawnDuck();}},1500);}`);
            h.push(`function endGame(){ip=false;ch.style.display='none';document.getElementById('fs').innerText=sc;go.classList.remove('hid');}`);
            h.push('<' + '/script></body></html>');
            
            // Fix property names mapping for minified game logic
            let finalHTML = h.join('\n');
            finalHTML = finalHTML.replace(/"le":"/g, '"lifeEmoji":"').replace(/"dc":"/g, '"duckCount":"').replace(/"duI":"/g, '"duckImage":"').replace(/"ts":/g, '"tasks":').replace(/"tm":/g, '"timer":"').replace(/"q":"/g, '"question":"').replace(/"a":"/g, '"answer":"').replace(/"t":"/g, '"type":"').replace(/"o":"/g, '"options":"').replace(/"sb":"/g, '"submit":"').replace(/"nx":"/g, '"next":"').replace(/"cr":"/g, '"correct":"').replace(/"wr":"/g, '"wrong":"');
            
            // Properly map tasks array properties
            let tasksJSON = JSON.stringify(c.tasks.map(t => ({q:t.question, a:t.answer, t:t.type, o:t.options})));
            finalHTML = finalHTML.replace(/"tasks":\[\]/, `"tasks":${tasksJSON}`);
            
            return finalHTML;
        }

        window.onload = init;
    </script>
